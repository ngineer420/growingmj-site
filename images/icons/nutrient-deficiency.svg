<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A leaf half green and half yellow, representing a nutrient deficiency">
  <style>
    /* Themed inside the file rather than by the page stylesheet, because an
       icon loaded as an image is its own document and cannot see the page.
       Light values stay as the literal fallbacks in the attributes below, so
       light output is unchanged; only the dark branch declares anything. */
    svg { color: #1f4d2c; }
    @media (prefers-color-scheme: dark) {
      svg {
        color: #8fd493;
        --i-mid: #57b06e;
        --i-hi: #a9dcae;
        --i-bg: #12160f;
        --i-warm: #e6c56e;
        --i-warm-line: #c9a35a;
        --i-warm-ink: #ddcb90;
        --i-warm-bg: #2a2413;
        --i-alarm: #d9755c;
        --i-cool: #78bde4;
      }
    }
  </style>
  <path d="M32 12 C46 16 50 30 44 42 C40 50 32 54 32 54 C32 54 24 50 20 42 C14 30 18 16 32 12 Z" fill="none" stroke="var(--i-ink, currentColor)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M32 14 C42 18 45 30 40 40 C37 47 32 51 32 51 Z" fill="var(--i-warm, #e3b23c)"/>
  <path d="M32 14 C22 18 19 30 24 40 C27 47 32 51 32 51 Z" fill="var(--i-mid, #2e7d42)"/>
  <line x1="32" y1="14" x2="32" y2="51" stroke="var(--i-ink, currentColor)" stroke-width="2"/>
</svg>
