<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Three growing medium cubes with a small sprout">
  <style>
    /* Themed inside the file rather than by the page stylesheet, because an
       icon loaded as an image is its own document and cannot see the page.
       Light values stay as the literal fallbacks in the attributes below, so
       light output is unchanged; only the dark branch declares anything. */
    svg { color: #1f4d2c; }
    @media (prefers-color-scheme: dark) {
      svg {
        color: #8fd493;
        --i-mid: #57b06e;
        --i-hi: #a9dcae;
        --i-bg: #12160f;
        --i-warm: #e6c56e;
        --i-warm-line: #c9a35a;
        --i-warm-ink: #ddcb90;
        --i-warm-bg: #2a2413;
        --i-alarm: #d9755c;
        --i-cool: #78bde4;
      }
    }
  </style>
  <rect x="10" y="38" width="14" height="14" rx="1.5" fill="var(--i-hi, #6fbf73)" stroke="var(--i-ink, currentColor)" stroke-width="2.5"/>
  <rect x="26" y="38" width="14" height="14" rx="1.5" fill="var(--i-bg, #f7f5ee)" stroke="var(--i-ink, currentColor)" stroke-width="2.5"/>
  <rect x="42" y="38" width="14" height="14" rx="1.5" fill="var(--i-warm-line, #c99a4a)" stroke="var(--i-ink, currentColor)" stroke-width="2.5"/>
  <path d="M33 38 C33 28 29 26 31 18 C37 22 39 28 35 34" fill="var(--i-mid, #2e7d42)" stroke="var(--i-ink, currentColor)" stroke-width="2" stroke-linejoin="round"/>
</svg>
