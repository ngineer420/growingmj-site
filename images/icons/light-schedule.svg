<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A grow light above a clock face representing a light schedule">
  <style>
    /* Themed inside the file rather than by the page stylesheet, because an
       icon loaded as an image is its own document and cannot see the page.
       Light values stay as the literal fallbacks in the attributes below, so
       light output is unchanged; only the dark branch declares anything. */
    svg { color: #1f4d2c; }
    @media (prefers-color-scheme: dark) {
      svg {
        color: #8fd493;
        --i-mid: #57b06e;
        --i-hi: #a9dcae;
        --i-bg: #12160f;
        --i-warm: #e6c56e;
        --i-warm-line: #c9a35a;
        --i-warm-ink: #ddcb90;
        --i-warm-bg: #2a2413;
        --i-alarm: #d9755c;
        --i-cool: #78bde4;
      }
    }
  </style>
  <rect x="14" y="8" width="36" height="8" rx="2" fill="var(--i-ink, currentColor)"/>
  <line x1="22" y1="16" x2="20" y2="24" stroke="var(--i-warm, #e0b64e)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="32" y2="25" stroke="var(--i-warm, #e0b64e)" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="16" x2="44" y2="24" stroke="var(--i-warm, #e0b64e)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="42" r="14" fill="var(--i-bg, #f7f5ee)" stroke="var(--i-ink, currentColor)" stroke-width="3"/>
  <line x1="32" y1="42" x2="32" y2="33" stroke="var(--i-mid, #2e7d42)" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="42" x2="39" y2="46" stroke="var(--i-hi, #6fbf73)" stroke-width="3" stroke-linecap="round"/>
</svg>
