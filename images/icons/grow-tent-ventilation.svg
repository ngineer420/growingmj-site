<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A ducting fan with airflow arrows, representing grow tent ventilation">
  <style>
    /* Themed inside the file rather than by the page stylesheet, because an
       icon loaded as an image is its own document and cannot see the page.
       Light values stay as the literal fallbacks in the attributes below, so
       light output is unchanged; only the dark branch declares anything. */
    svg { color: #1f4d2c; }
    @media (prefers-color-scheme: dark) {
      svg {
        color: #8fd493;
        --i-mid: #57b06e;
        --i-hi: #a9dcae;
        --i-bg: #12160f;
        --i-warm: #e6c56e;
        --i-warm-line: #c9a35a;
        --i-warm-ink: #ddcb90;
        --i-warm-bg: #2a2413;
        --i-alarm: #d9755c;
        --i-cool: #78bde4;
      }
    }
  </style>
  <circle cx="32" cy="30" r="16" fill="var(--i-bg, #f7f5ee)" stroke="var(--i-ink, currentColor)" stroke-width="3"/>
  <path d="M32 30 C32 22 38 20 38 30 C38 38 32 40 32 30 Z" fill="var(--i-mid, #2e7d42)" transform="rotate(0 32 30)"/>
  <path d="M32 30 C32 22 38 20 38 30 C38 38 32 40 32 30 Z" fill="var(--i-mid, #2e7d42)" transform="rotate(120 32 30)"/>
  <path d="M32 30 C32 22 38 20 38 30 C38 38 32 40 32 30 Z" fill="var(--i-mid, #2e7d42)" transform="rotate(240 32 30)"/>
  <circle cx="32" cy="30" r="3.5" fill="var(--i-ink, currentColor)"/>
  <path d="M50 30 L58 30 M55 26 L58 30 L55 34" fill="none" stroke="var(--i-hi, #6fbf73)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M6 46 L14 46 M11 42 L14 46 L11 50" fill="none" stroke="var(--i-hi, #6fbf73)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
