<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A shallow tray densely planted with microgreen sprouts">
  <style>
    /* Themed inside the file rather than by the page stylesheet, because an
       icon loaded as an image is its own document and cannot see the page.
       Light values stay as the literal fallbacks in the attributes below, so
       light output is unchanged; only the dark branch declares anything. */
    svg { color: #1f4d2c; }
    @media (prefers-color-scheme: dark) {
      svg {
        color: #8fd493;
        --i-mid: #57b06e;
        --i-hi: #a9dcae;
        --i-bg: #12160f;
        --i-warm: #e6c56e;
        --i-warm-line: #c9a35a;
        --i-warm-ink: #ddcb90;
        --i-warm-bg: #2a2413;
        --i-alarm: #d9755c;
        --i-cool: #78bde4;
      }
    }
  </style>
  <rect x="10" y="42" width="44" height="12" rx="2" fill="var(--i-bg, #f7f5ee)" stroke="var(--i-ink, currentColor)" stroke-width="3"/>
  <path d="M18 42 C17 36 15 34 14 30 C18 32 20 36 19 42" fill="var(--i-hi, #6fbf73)"/>
  <path d="M25 42 C25 34 23 32 23 27 C27 30 28 35 26 42" fill="var(--i-mid, #2e7d42)"/>
  <path d="M32 42 C32 33 30 30 31 24 C35 28 35 34 33 42" fill="var(--i-hi, #6fbf73)"/>
  <path d="M39 42 C39 35 38 32 38 28 C42 31 42 36 40 42" fill="var(--i-mid, #2e7d42)"/>
  <path d="M46 42 C46 37 45 34 44 31 C48 33 49 37 47 42" fill="var(--i-hi, #6fbf73)"/>
</svg>
