<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A drooping plant, representing common gardening mistakes">
  <style>
    /* Themed inside the file rather than by the page stylesheet, because an
       icon loaded as an image is its own document and cannot see the page.
       Light values stay as the literal fallbacks in the attributes below, so
       light output is unchanged; only the dark branch declares anything. */
    svg { color: #1f4d2c; }
    @media (prefers-color-scheme: dark) {
      svg {
        color: #8fd493;
        --i-mid: #57b06e;
        --i-hi: #a9dcae;
        --i-bg: #12160f;
        --i-warm: #e6c56e;
        --i-warm-line: #c9a35a;
        --i-warm-ink: #ddcb90;
        --i-warm-bg: #2a2413;
        --i-alarm: #d9755c;
        --i-cool: #78bde4;
      }
    }
  </style>
  <path d="M18 44 L46 44 L43 58 L21 58 Z" fill="var(--i-bg, #f7f5ee)" stroke="var(--i-ink, currentColor)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M32 44 C32 30 42 27 38 16 C29 21 26 30 30 40" fill="none" stroke="var(--i-mid, #2e7d42)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="46" cy="16" r="9" fill="var(--i-warm-bg, #fdf6e3)" stroke="var(--i-warm-line, #c99a4a)" stroke-width="2"/>
  <line x1="46" y1="11.5" x2="46" y2="18" stroke="var(--i-warm-ink, #5c4a12)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46" cy="21" r="1.3" fill="var(--i-warm-ink, #5c4a12)"/>
</svg>
