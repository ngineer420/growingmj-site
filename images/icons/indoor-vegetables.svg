<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A tomato and a leafy vegetable in a pot">
  <style>
    /* Themed inside the file rather than by the page stylesheet, because an
       icon loaded as an image is its own document and cannot see the page.
       Light values stay as the literal fallbacks in the attributes below, so
       light output is unchanged; only the dark branch declares anything. */
    svg { color: #1f4d2c; }
    @media (prefers-color-scheme: dark) {
      svg {
        color: #8fd493;
        --i-mid: #57b06e;
        --i-hi: #a9dcae;
        --i-bg: #12160f;
        --i-warm: #e6c56e;
        --i-warm-line: #c9a35a;
        --i-warm-ink: #ddcb90;
        --i-warm-bg: #2a2413;
        --i-alarm: #d9755c;
        --i-cool: #78bde4;
      }
    }
  </style>
  <path d="M16 44 L48 44 L44 58 L20 58 Z" fill="var(--i-bg, #f7f5ee)" stroke="var(--i-ink, currentColor)" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="26" cy="32" r="10" fill="var(--i-alarm, #c9542f)" stroke="var(--i-ink, currentColor)" stroke-width="2.5"/>
  <path d="M22 24 C24 20 28 20 30 24" fill="none" stroke="var(--i-mid, #2e7d42)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M42 44 C42 34 36 30 34 20 C42 22 47 30 45 40" fill="var(--i-hi, #6fbf73)" stroke="var(--i-ink, currentColor)" stroke-width="2" stroke-linejoin="round"/>
</svg>
