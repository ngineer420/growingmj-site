<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A seed sprouting inside a seed tray cell">
  <style>
    /* Themed inside the file rather than by the page stylesheet, because an
       icon loaded as an image is its own document and cannot see the page.
       Light values stay as the literal fallbacks in the attributes below, so
       light output is unchanged; only the dark branch declares anything. */
    svg { color: #1f4d2c; }
    @media (prefers-color-scheme: dark) {
      svg {
        color: #8fd493;
        --i-mid: #57b06e;
        --i-hi: #a9dcae;
        --i-bg: #12160f;
        --i-warm: #e6c56e;
        --i-warm-line: #c9a35a;
        --i-warm-ink: #ddcb90;
        --i-warm-bg: #2a2413;
        --i-alarm: #d9755c;
        --i-cool: #78bde4;
      }
    }
  </style>
  <rect x="12" y="34" width="40" height="20" rx="2" fill="var(--i-bg, #f7f5ee)" stroke="var(--i-ink, currentColor)" stroke-width="3"/>
  <line x1="32" y1="34" x2="32" y2="54" stroke="var(--i-ink, currentColor)" stroke-width="2"/>
  <ellipse cx="20" cy="44" rx="4.5" ry="6" fill="var(--i-warm-line, #c99a4a)" stroke="var(--i-ink, currentColor)" stroke-width="1.5"/>
  <path d="M40 44 C40 38 38 34 40 28 C43 32 45 36 43 42" fill="var(--i-hi, #6fbf73)" stroke="var(--i-ink, currentColor)" stroke-width="2" stroke-linejoin="round"/>
  <line x1="40" y1="44" x2="40" y2="28" stroke="var(--i-mid, #2e7d42)" stroke-width="2"/>
</svg>
