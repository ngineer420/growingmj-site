<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pruning shears trimming a branching stem">
  <style>
    /* Themed inside the file rather than by the page stylesheet, because an
       icon loaded as an image is its own document and cannot see the page.
       Light values stay as the literal fallbacks in the attributes below, so
       light output is unchanged; only the dark branch declares anything. */
    svg { color: #1f4d2c; }
    @media (prefers-color-scheme: dark) {
      svg {
        color: #8fd493;
        --i-mid: #57b06e;
        --i-hi: #a9dcae;
        --i-bg: #12160f;
        --i-warm: #e6c56e;
        --i-warm-line: #c9a35a;
        --i-warm-ink: #ddcb90;
        --i-warm-bg: #2a2413;
        --i-alarm: #d9755c;
        --i-cool: #78bde4;
      }
    }
  </style>
  <line x1="32" y1="54" x2="32" y2="26" stroke="var(--i-mid, #2e7d42)" stroke-width="3"/>
  <path d="M32 40 C26 36 22 36 18 30 C25 29 30 33 32 38" fill="var(--i-hi, #6fbf73)"/>
  <path d="M32 32 C36 26 41 26 46 22 C44 29 38 32 33 31" fill="var(--i-mid, #2e7d42)"/>
  <line x1="32" y1="26" x2="32" y2="18" stroke="var(--i-warm-line, #c99a4a)" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M22 10 L34 22 M42 10 L30 22" stroke="var(--i-ink, currentColor)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="21" cy="9" r="3" fill="var(--i-bg, #f7f5ee)" stroke="var(--i-ink, currentColor)" stroke-width="2"/>
  <circle cx="43" cy="9" r="3" fill="var(--i-bg, #f7f5ee)" stroke="var(--i-ink, currentColor)" stroke-width="2"/>
</svg>
