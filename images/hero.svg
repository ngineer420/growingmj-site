<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="A grow light shining on three potted plants inside a grow tent">
  <style>
    /* Themed inside the file rather than by the page stylesheet, because an
       icon loaded as an image is its own document and cannot see the page.
       Light values stay as the literal fallbacks in the attributes below, so
       light output is unchanged; only the dark branch declares anything. */
    svg { color: #1f4d2c; }
    @media (prefers-color-scheme: dark) {
      svg {
        color: #8fd493;
        --i-mid: #57b06e;
        --i-hi: #a9dcae;
        --i-bg: #12160f;
        --i-warm: #e6c56e;
        --i-warm-line: #c9a35a;
        --i-warm-ink: #ddcb90;
        --i-warm-bg: #2a2413;
        --i-alarm: #d9755c;
        --i-cool: #78bde4;
      }
    }
  </style>
  <path d="M120 190 L320 40 L520 190" fill="none" stroke="var(--i-ink, currentColor)" stroke-width="3" opacity="0.35"/>

  <rect x="260" y="30" width="120" height="14" rx="3" fill="var(--i-ink, currentColor)"/>
  <line x1="280" y1="48" x2="270" y2="80" stroke="var(--i-hi, #6fbf73)" stroke-width="3" stroke-linecap="round"/>
  <line x1="320" y1="48" x2="320" y2="84" stroke="var(--i-hi, #6fbf73)" stroke-width="3" stroke-linecap="round"/>
  <line x1="360" y1="48" x2="370" y2="80" stroke="var(--i-hi, #6fbf73)" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(220,190)">
    <path d="M-16 0 L16 0 L12 26 L-12 26 Z" fill="var(--i-bg, #f7f5ee)" stroke="var(--i-ink, currentColor)" stroke-width="3"/>
    <path d="M0 0 C0 -14 -10 -16 -14 -26 C-6 -24 2 -18 0 -6" fill="var(--i-mid, #2e7d42)"/>
    <path d="M0 0 C0 -12 8 -14 12 -22 C6 -20 0 -14 0 -4" fill="var(--i-hi, #6fbf73)"/>
  </g>
  <g transform="translate(320,196)">
    <path d="M-20 0 L20 0 L15 30 L-15 30 Z" fill="var(--i-bg, #f7f5ee)" stroke="var(--i-ink, currentColor)" stroke-width="3"/>
    <path d="M0 0 C0 -18 -12 -20 -16 -32 C-6 -28 2 -22 0 -8" fill="var(--i-hi, #6fbf73)"/>
    <path d="M0 0 C0 -16 10 -18 14 -28 C6 -24 0 -18 0 -6" fill="var(--i-mid, #2e7d42)"/>
  </g>
  <g transform="translate(420,190)">
    <path d="M-16 0 L16 0 L12 26 L-12 26 Z" fill="var(--i-bg, #f7f5ee)" stroke="var(--i-ink, currentColor)" stroke-width="3"/>
    <path d="M0 0 C0 -14 -10 -16 -14 -26 C-6 -24 2 -18 0 -6" fill="var(--i-mid, #2e7d42)"/>
    <path d="M0 0 C0 -12 8 -14 12 -22 C6 -20 0 -14 0 -4" fill="var(--i-hi, #6fbf73)"/>
  </g>
</svg>
